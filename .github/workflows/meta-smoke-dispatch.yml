name: One-time Meta publish smoke dispatch

on:
  push:
    branches: [main]
    paths:
      - data/meta_smoke_test.trigger

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one approved property through the real autopilot path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/dispatches" \
            -d '{"event_type":"render-property-videos","client_payload":{"video_ids":"qdHeuxgZdIA","source":"meta-smoke-test"}}'
          echo "Dispatched qdHeuxgZdIA through repository_dispatch." >> "$GITHUB_STEP_SUMMARY"
