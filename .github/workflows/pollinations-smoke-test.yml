name: Cloudflare Fresh Image Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pollinations-smoke-test.yml'
      - 'cloudflare_ai_visual_pipeline.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          pip install -r requirements-ai.txt

      - name: Generate fresh Cloudflare image pack
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGE_MODEL: '@cf/black-forest-labs/flux-1-schnell'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AI_BROLL_MAX_ANIMATED: '0'
          POLLINATIONS_API_KEY: ''
          HF_TOKEN: ''
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID or existing R2_ACCOUNT_ID is missing'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          printf '2jHws5Fg5Ac\n' > /tmp/cloudflare-queue.txt
          rm -rf assets/ai_broll/2jHws5Fg5Ac
          python cloudflare_ai_visual_pipeline.py --queue /tmp/cloudflare-queue.txt --max-animated 0
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('assets/ai_broll/2jHws5Fg5Ac/manifest.json')
          data = json.loads(p.read_text())
          rows = data.get('scenes', [])
          if not rows:
              raise SystemExit('No generated scenes found')
          bad = [r for r in rows if not str(r.get('image_backend', '')).startswith('cloudflare:')]
          if bad:
              raise SystemExit(f"Expected Cloudflare-only image pack, got {[r.get('image_backend') for r in bad]}")
          print('Cloudflare Workers AI backend verified.')
          for row in rows:
              print(row.get('scene'), row.get('image_backend'), row.get('still'))
          PY

      - name: Upload fresh Cloudflare images
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-fresh-images-${{ github.run_number }}
          path: |
            assets/ai_broll/2jHws5Fg5Ac/manifest.json
            assets/ai_broll/2jHws5Fg5Ac/**/*.jpg
            assets/ai_broll/2jHws5Fg5Ac/**/*.mp4
          if-no-files-found: error
          retention-days: 3
