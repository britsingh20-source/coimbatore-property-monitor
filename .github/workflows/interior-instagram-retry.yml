name: Interior Instagram Retry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/interior-instagram-retry.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install boto3 requests
      - name: Republish last interior upload to correct Instagram account
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          INTERIOR_META_ACCESS_TOKEN: ${{ secrets.INTERIOR_META_ACCESS_TOKEN }}
          INTERIOR_IG_USER_ID: ${{ secrets.INTERIOR_IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          import boto3, requests

          GRAPH='https://graph.facebook.com/v23.0'
          EXPECTED_USERNAME='olivetreeinteriors777'
          key='interior-social-ready/sUmQvFpBXVU-AgADbiQAAvCKGVU.mp4'
          source_id='sUmQvFpBXVU'
          igid=os.environ['INTERIOR_IG_USER_ID']
          token=os.environ['INTERIOR_META_ACCESS_TOKEN']

          def send(text):
              requests.post(
                  f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
                  data={'chat_id':os.environ['TELEGRAM_CHAT_ID'],'text':text},timeout=30
              ).raise_for_status()

          # Safety check: never publish unless GitHub is now pointing at the requested account.
          r=requests.get(f'{GRAPH}/{igid}',params={'fields':'id,username,name','access_token':token},timeout=30)
          body=r.json()
          if not r.ok or body.get('error'):
              raise RuntimeError(f'Instagram account check failed: {body}')
          username=str(body.get('username') or '').lower()
          if username != EXPECTED_USERNAME:
              raise RuntimeError(f'Refusing to publish: configured account is @{username}, expected @{EXPECTED_USERNAME}')

          client=boto3.client(
              's3',
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              region_name='auto',
          )
          url=client.generate_presigned_url('get_object',Params={'Bucket':os.environ['R2_BUCKET_NAME'],'Key':key},ExpiresIn=21600)

          content=rec.get('content') or {}
          caption=str(content.get('instagram_caption') or '').strip()
          if not caption:
              raise RuntimeError('No video-analyzed caption is stored; refusing a generic retry caption')

          r=requests.post(f'{GRAPH}/{igid}/media',data={
              'media_type':'REELS','video_url':url,'caption':caption,
              'share_to_feed':'true','access_token':token,
          },timeout=60)
          body=r.json()
          if not r.ok or body.get('error') or not body.get('id'):
              raise RuntimeError(f'Instagram Reel container creation failed: {body}')
          creation_id=str(body['id'])

          for _ in range(30):
              r=requests.get(f'{GRAPH}/{creation_id}',params={'fields':'status_code,status','access_token':token},timeout=30)
              st=r.json()
              if not r.ok or st.get('error'):
                  raise RuntimeError(f'Instagram container status failed: {st}')
              code=str(st.get('status_code') or '').upper()
              if code=='FINISHED': break
              if code in {'ERROR','EXPIRED'}:
                  raise RuntimeError(f'Instagram container failed: {st}')
              time.sleep(10)
          else:
              raise RuntimeError('Instagram container timed out')

          r=requests.post(f'{GRAPH}/{igid}/media_publish',data={'creation_id':creation_id,'access_token':token},timeout=60)
          pub=r.json()
          if not r.ok or pub.get('error') or not pub.get('id'):
              raise RuntimeError(f'Instagram Reel publish failed: {pub}')
          media_id=str(pub['id'])

          # Verify the published media really belongs to the correct username.
          r=requests.get(f'{GRAPH}/{media_id}',params={'fields':'id,username,permalink,timestamp','access_token':token},timeout=30)
          media=r.json()
          if not r.ok or media.get('error'):
              raise RuntimeError(f'Published media verification failed: {media}')
          if str(media.get('username') or '').lower()!=EXPECTED_USERNAME:
              raise RuntimeError(f'Published media belongs to wrong account: {media}')

          state_path=Path('data/interior_social_publish_state.json')
          state=json.loads(state_path.read_text()) if state_path.exists() else {'objects':{},'telegram_files':{}}
          rec=state.setdefault('objects',{}).setdefault(key,{'source_id':source_id,'r2_key':key})
          rec['instagram']={
              'status':'published','creation_id':creation_id,'media_id':media_id,
              'username':media.get('username'),'permalink':media.get('permalink'),
          }
          tg=state.setdefault('telegram_files',{}).setdefault('AgADbiQAAvCKGVU',rec)
          tg['instagram']=dict(rec['instagram'])
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2,sort_keys=True)+'\n')

          send('✅ Interior Instagram retry published successfully\nAccount: @'+EXPECTED_USERNAME+'\nINTERIOR_ID: '+source_id+'\n'+str(media.get('permalink') or ''))
          print(json.dumps(media,ensure_ascii=False))
          PY
      - name: Commit corrected Instagram publishing state
        if: always()
        run: |
          git config user.name "interior-social-bot"
          git config user.email "actions@github.com"
          git add data/interior_social_publish_state.json
          if git diff --staged --quiet; then
            echo "No state change"
          else
            git commit -m "Record corrected Olive Tree Interiors Instagram publish [automated]"
            git pull --rebase
            git push
          fi
