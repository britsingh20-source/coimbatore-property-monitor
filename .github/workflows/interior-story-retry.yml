name: Interior Story Retry

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/interior-story-retry.yml"

permissions:
  contents: write

jobs:
  retry-story:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install boto3 requests
      - name: Publish last interior R2 video to Instagram Story
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          INTERIOR_META_ACCESS_TOKEN: ${{ secrets.INTERIOR_META_ACCESS_TOKEN }}
          INTERIOR_IG_USER_ID: ${{ secrets.INTERIOR_IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, time, requests, boto3
          from pathlib import Path

          graph='https://graph.facebook.com/v23.0'
          token=os.environ['INTERIOR_META_ACCESS_TOKEN']
          igid=os.environ['INTERIOR_IG_USER_ID']
          chat=os.environ['TELEGRAM_CHAT_ID']
          bot=os.environ['TELEGRAM_BOT_TOKEN']

          account=requests.get(f'{graph}/{igid}',params={'fields':'id,username','access_token':token},timeout=30)
          account_body=account.json()
          if account_body.get('username') != 'olivetreeinteriors777':
              raise RuntimeError(f"Refusing Story publish: configured Instagram is @{account_body.get('username')}")

          state_path=Path('data/interior_social_publish_state.json')
          state=json.loads(state_path.read_text())
          key='interior-social-ready/sUmQvFpBXVU-AgADbiQAAvCKGVU.mp4'
          record=state['objects'][key]

          r2=boto3.client('s3',endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],region_name='auto')
          url=r2.generate_presigned_url('get_object',Params={'Bucket':os.environ['R2_BUCKET_NAME'],'Key':key},ExpiresIn=21600)

          r=requests.post(f'{graph}/{igid}/media',data={'media_type':'STORIES','video_url':url,'access_token':token},timeout=60)
          body=r.json()
          if not r.ok or body.get('error') or not body.get('id'):
              raise RuntimeError(f'Story container creation failed: {body}')
          creation_id=str(body['id'])

          for _ in range(30):
              s=requests.get(f'{graph}/{creation_id}',params={'fields':'status_code,status','access_token':token},timeout=30)
              sb=s.json()
              if not s.ok or sb.get('error'):
                  raise RuntimeError(f'Story status failed: {sb}')
              status=str(sb.get('status_code') or '').upper()
              if status=='FINISHED':
                  break
              if status in {'ERROR','EXPIRED'}:
                  raise RuntimeError(f'Story container failed: {sb}')
              time.sleep(10)
          else:
              raise RuntimeError('Story container timed out')

          p=requests.post(f'{graph}/{igid}/media_publish',data={'creation_id':creation_id,'access_token':token},timeout=60)
          pb=p.json()
          if not p.ok or pb.get('error') or not pb.get('id'):
              raise RuntimeError(f'Story publish failed: {pb}')

          story={'status':'published','creation_id':creation_id,'media_id':pb['id'],'username':'olivetreeinteriors777'}
          record['instagram_story']=story
          for item in state.get('telegram_files',{}).values():
              if item.get('r2_key')==key:
                  item['instagram_story']=story
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2,sort_keys=True)+'\n')

          requests.post(f'https://api.telegram.org/bot{bot}/sendMessage',data={'chat_id':chat,'text':'✅ Interior Instagram Story published\nAccount: @olivetreeinteriors777\nINTERIOR_ID: sUmQvFpBXVU'},timeout=30).raise_for_status()
          print('Story published:', pb['id'])
          PY
      - name: Commit Story state
        shell: bash
        run: |
          git config user.name "interior-social-bot"
          git config user.email "actions@github.com"
          git add data/interior_social_publish_state.json
          if ! git diff --staged --quiet; then
            git commit -m "Record interior Instagram Story publish [automated]"
            git pull --rebase
            git push
          fi
