name: Vadavalli Prompt Scope Test

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-focus-e2e-test.yml"
      - "location_matcher.py"
      - "metadata_prefilter.py"
      - "send_telegram_prompts.py"
      - "telegram_router.py"
      - "telegram_r2_ingest.py"
      - "r2_social_autopilot.py"
      - "config/focus_areas.json"
      - "config/locations.json"
      - "config/weekly_focus.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Verify Vadavalli-only prompt catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          locations = json.loads(Path('config/locations.json').read_text(encoding='utf-8'))
          assert 'Vadavalli' in locations.get('target_localities', {}), locations

          catalog = json.loads(Path('config/focus_areas.json').read_text(encoding='utf-8'))
          slugs = [area.get('slug') for area in catalog.get('areas', [])]
          for required in ('vadavalli', 'karamadai', 'saravanampatti', 'kalapatti', 'sulur', 'kovilpalayam'):
              assert required in slugs, (required, slugs)
          assert catalog.get('rules', {}).get('max_selected') == len(catalog['areas']), catalog

          focus = json.loads(Path('config/weekly_focus.json').read_text(encoding='utf-8'))
          assert [area.get('name') for area in focus.get('focus_areas', [])] == ['Vadavalli'], focus
          assert focus.get('rules', {}).get('require_focus_match_for_prompt') is True, focus
          assert focus.get('rules', {}).get('allow_citywide_fallback') is False, focus
          print('Vadavalli-only prompt configuration passed')
          PY

      - name: Verify prompt matcher rejects every other area
        run: |
          python - <<'PY'
          from location_matcher import match_location

          assert match_location('Vadavalli, Coimbatore')['is_target_location'] is True
          for area in (
              'Saravanampatti', 'Idigarai', 'Karamadai', 'Periyanaickenpalayam',
              'Mettupalayam', 'Thudiyalur', 'Somayampalayam', 'Bommanampalayam',
          ):
              result = match_location(f'{area}, Coimbatore')
              assert result['is_target_location'] is False, (area, result)
          print('Prompt matcher isolation passed')
          PY

      - name: Verify video publishing remains area-independent
        shell: bash
        run: |
          set -euo pipefail
          if rg -n "Vadavalli|match_location|target_localit" \
            telegram_router.py telegram_r2_ingest.py r2_social_autopilot.py; then
            echo "Video publishing must not contain a locality gate."
            exit 1
          fi
          echo "Video pairing, R2 ingest and social publishing remain area-independent."
