name: All-Area Property Prompt Test

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-focus-e2e-test.yml"
      - "location_matcher.py"
      - "metadata_prefilter.py"
      - "telegram_router.py"
      - "telegram_r2_ingest.py"
      - "r2_social_autopilot.py"
      - "config/locations.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Verify prompts accept every area
        run: |
          python - <<'PY'
          from location_matcher import match_location
          from metadata_prefilter import metadata_score

          for area in (
              'Vadavalli', 'Saravanampatti', 'Idigarai', 'Karamadai',
              'Periyanaickenpalayam', 'Kalapatti', 'Sulur', 'Somayampalayam',
          ):
              location = match_location(f'Villa for sale in {area}, Coimbatore')
              assert location['is_target_location'] is True, (area, location)
              signals = metadata_score({'title': f'Villa for sale in {area}', 'description': ''})
              assert signals['strong_target'] is True, (area, signals)

          assert match_location('House somewhere in Coimbatore')['is_target_location'] is True
          print('All-area property prompt configuration passed')
          PY

      - name: Verify no focus control or prompt filter remains
        shell: bash
        run: |
          set -euo pipefail
          test ! -e config/focus_areas.json
          test ! -e config/weekly_focus.json
          test ! -e .github/workflows/update-weekly-focus.yml
          if rg -n "weekly-focus|focus:toggle|Property Focus Control" \
            location_matcher.py metadata_prefilter.py cloudflare/social-trigger/src/index.ts; then
            echo "A property focus filter is still active."
            exit 1
          fi
          echo "Property focus filtering is fully removed."

      - name: Verify video publishing remains area-independent
        shell: bash
        run: |
          set -euo pipefail
          if rg -n "Vadavalli|match_location|target_localit" \
            telegram_router.py telegram_r2_ingest.py r2_social_autopilot.py; then
            echo "Video publishing must not contain a locality gate."
            exit 1
          fi
          echo "Video pairing, R2 ingest and social publishing remain area-independent."
