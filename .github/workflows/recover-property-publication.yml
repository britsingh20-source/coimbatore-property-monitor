name: Recover exact property publication

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-property-publication.yml']
  workflow_dispatch:
    inputs:
      r2_key:
        description: Exact uploaded property video key
        type: string
        default: social-ready/K7nJbjEMB9U.mp4
        required: true

concurrency:
  group: property-automation-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish exact uploaded video with destination duplicate protection
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_SOCIAL_PREFIX: ${{ inputs.r2_key || 'social-ready/K7nJbjEMB9U.mp4' }}
          SOCIAL_MAX_PER_RUN: '1'
          SOCIAL_DRY_RUN: 'false'
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -u r2_social_autopilot.py
      - name: Save destination receipts even if another destination fails
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'property-social-bot'
          git config user.email 'actions@github.com'
          git add data/social_publish_state.json data/telegram_prompt_queue.json
          if ! git diff --staged --quiet; then
            git commit -m 'Save exact property publication receipts [automated]'
            git pull --rebase
            git push
          fi
