name: Interior Meta Account Map

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/interior-meta-account-map.yml"

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Discover accessible Facebook pages and linked Instagram accounts
        env:
          TOKEN: ${{ secrets.INTERIOR_META_ACCESS_TOKEN }}
          CURRENT_PAGE_ID: ${{ secrets.INTERIOR_META_PAGE_ID }}
          CURRENT_IG_ID: ${{ secrets.INTERIOR_IG_USER_ID }}
        run: |
          python - <<'PY'
          import json, os, requests
          graph='https://graph.facebook.com/v23.0'
          token=os.environ['TOKEN']
          target='olivetreeinteriors777'
          def get(path, fields=None, after=None):
              params={}
              if fields: params['fields']=fields
              if after: params['after']=after
              r=requests.get(f'{graph}/{path}',headers={'Authorization':'Bearer '+token},params=params,timeout=30)
              body=r.json()
              if not r.ok:
                  e=body.get('error',{})
                  print(json.dumps({'path':path,'http':r.status_code,'code':e.get('code'),'subcode':e.get('error_subcode'),'message':e.get('message')}))
              return body
          fields='id,name,instagram_business_account{id,username},connected_instagram_account{id,username}'
          def summary(kind, body):
              print(json.dumps({'kind':kind, **{k:body[k] for k in ('id','name','username','instagram_business_account','connected_instagram_account') if k in body}}))
          summary('token_identity',get('me','id,name'))
          summary('configured_instagram',get(os.environ['CURRENT_IG_ID'],'id,username,name'))
          pages=[]
          page_id=os.environ.get('CURRENT_PAGE_ID','').strip()
          if page_id:
              page=get(page_id,fields)
              summary('configured_page',page)
              pages.append(page)
          after=None
          for _ in range(20):
              body=get('me/accounts',fields,after)
              for page in body.get('data',[]):
                  summary('accessible_page',page)
                  pages.append(page)
              paging=body.get('paging',{})
              after=paging.get('cursors',{}).get('after')
              if not paging.get('next') or not after: break
          permissions=get('me/permissions')
          print('PERMISSIONS='+json.dumps(permissions.get('data',[])))
          matches={}
          for page in pages:
              for field in ('instagram_business_account','connected_instagram_account'):
                  ig=page.get(field) or {}
                  if str(ig.get('username','')).lower()==target:
                      matches[ig['id']]={'page_id':page['id'],'ig_id':ig['id'],'username':ig['username']}
          print('TARGET_MATCHES='+json.dumps(list(matches.values())))
          if not matches:
              raise SystemExit('No accessible linked Instagram account matches @'+target)
          PY
