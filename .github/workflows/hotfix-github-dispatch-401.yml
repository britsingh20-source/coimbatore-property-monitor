name: Hotfix Telegram VIDEO_ID Pairing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-github-dispatch-401.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fix labelled VIDEO_ID parser
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('telegram_r2_ingest.py')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'r"reference[\\\\s_-]*id\\\\s*[:=\\\\-]\\\\s*([A-Za-z0-9_-]{6,32})"': 'r"reference[\\s_-]*id\\s*[:=\\-]\\s*([A-Za-z0-9_-]{6,32})"',
              'r"(?:video[\\\\s_-]*id|id)\\\\s*[:=\\\\-]\\\\s*([A-Za-z0-9_-]{6,32})"': 'r"(?:video[\\s_-]*id|id)\\s*[:=\\-]\\s*([A-Za-z0-9_-]{6,32})"',
              'r"([A-Za-z0-9_-]{11})-gemini-veo-prompt\\\\.txt$"': 'r"([A-Za-z0-9_-]{11})-gemini-veo-prompt\\.txt$"',
          }
          changed = 0
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed += 1
          if changed < 2:
              raise SystemExit(f'Expected Telegram regex defects were not found safely; changed={changed}')
          p.write_text(text, encoding='utf-8')

          import re
          # Direct behavioral guard for the exact Cloudflare-injected caption.
          m = re.search(r'(?:video[\s_-]*id|id)\s*[:=\-]\s*([A-Za-z0-9_-]{6,32})', 'VIDEO_ID: M0iRDEf_DfQ', flags=re.I)
          assert m and m.group(1) == 'M0iRDEf_DfQ'
          print('VIDEO_ID labelled-caption parser fixed and verified.')
          PY

      - name: Commit pairing fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_r2_ingest.py
          if git diff --cached --quiet; then
            echo "Pairing parser already fixed."
            exit 0
          fi
          git commit -m "Fix Cloudflare labelled VIDEO_ID pairing"
          git pull --rebase
          git push
