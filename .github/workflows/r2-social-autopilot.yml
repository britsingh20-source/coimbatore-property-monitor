# Verified footer recovery trigger: manual-AgADfycAAinL-VQ
name: R2 Social Publishing Autopilot

on:
  repository_dispatch:
    types: [telegram-property-upload, r2-social-object-created]
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/r2-social-autopilot.yml"
      - "r2_social_autopilot.py"
      - "telegram_r2_ingest.py"
      - "telegram_router.py"
      - "interior_social_autopilot.py"
      - "manual_video_intake.py"
      - "reference_frames.py"
      - "requirements.txt"
      - "social_content.py"
      - "send_telegram_prompts.py"
      - "video_property_matcher.py"
      - "meta_publisher.py"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scan and prepare metadata without publishing
        required: true
        default: true
        type: boolean

concurrency:
  group: property-automation-state
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install video normalization tools
        timeout-minutes: 5
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: pip install -r requirements.txt

      - name: Recover confirmed MANUAL_PUBLISH upload
        if: github.event_name != 'repository_dispatch' || github.event.action == 'telegram-property-upload'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/telegram_ingest_state.json')
          state = json.loads(path.read_text(encoding='utf-8'))
          unique_id = 'AgADfCcAAinL-VQ'
          item = state.setdefault('files', {}).get(unique_id)
          if item and item.get('r2_key') and item.get('status') in {
              'uploaded_awaiting_content_match',
              'uploaded_awaiting_video_id',
              'manual_audio_analysis_failed',
          }:
              item['status'] = 'manual_audio_recovery_requested'
              item['manual_recovery_reason'] = 'user_confirmed_MANUAL_PUBLISH_2026-09-08'
              path.write_text(json.dumps(state, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              print(f'Recovery armed for {unique_id}: {item["r2_key"]}')
          else:
              print(f'No recovery state change needed for {unique_id}: {item}')
          PY

      - name: Route Telegram uploads to Property or Interior publisher
        id: telegram_ingest
        # Telegram is webhook-driven now. Only process the exact webhook update
        # forwarded by Cloudflare; never call getUpdates while the webhook is active.
        if: github.event_name == 'repository_dispatch' && github.event.action == 'telegram-property-upload'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_SOCIAL_PREFIX: social-ready/
          TELEGRAM_MAX_VIDEO_BYTES: "20971520"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MANUAL_AUDIO_MODEL: gemini-2.5-flash
          INTERIOR_META_ACCESS_TOKEN: ${{ secrets.INTERIOR_META_ACCESS_TOKEN }}
          INTERIOR_META_PAGE_ID: ${{ secrets.INTERIOR_META_PAGE_ID }}
          INTERIOR_IG_USER_ID: ${{ secrets.INTERIOR_IG_USER_ID }}
          INTERIOR_YOUTUBE_CLIENT_ID: ${{ secrets.INTERIOR_YOUTUBE_CLIENT_ID }}
          INTERIOR_YOUTUBE_CLIENT_SECRET: ${{ secrets.INTERIOR_YOUTUBE_CLIENT_SECRET }}
          INTERIOR_YOUTUBE_REFRESH_TOKEN: ${{ secrets.INTERIOR_YOUTUBE_REFRESH_TOKEN }}
          INTERIOR_YOUTUBE_PRIVACY_STATUS: public
          TELEGRAM_WEBHOOK_UPDATE_JSON: ${{ toJson(github.event.client_payload.update) }}
        run: python telegram_router.py

      - name: Scan R2 and publish new property videos
        id: autopilot
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_SOCIAL_PREFIX: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'r2-social-object-created' && github.event.client_payload.r2_key || 'social-ready/' }}
          SOCIAL_MAX_PER_RUN: ${{ github.event_name == 'repository_dispatch' && '1' || '5' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SOCIAL_MATCH_MODEL: gemini-3.5-flash-lite
          SOCIAL_MATCH_MIN_CONFIDENCE: "0.85"
          SOCIAL_DRY_RUN: ${{ github.event_name == 'repository_dispatch' && 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[social-live-test]'))) }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          INTERIOR_META_ACCESS_TOKEN: ${{ secrets.INTERIOR_META_ACCESS_TOKEN }}
          INTERIOR_META_PAGE_ID: ${{ secrets.INTERIOR_META_PAGE_ID }}
          INTERIOR_IG_USER_ID: ${{ secrets.INTERIOR_IG_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
        run: python r2_social_autopilot.py
      - name: Commit ingestion and publishing state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "property-social-bot"
          git config user.email "actions@github.com"
          git add data/telegram_ingest_state.json data/social_publish_state.json data/interior_social_publish_state.json data/telegram_prompt_queue.json data/video_jobs/*.json
          if git diff --staged --quiet; then
            echo "No Telegram ingestion, social publishing or prompt-pairing state changes."
          else
            git commit -m "Update Telegram ingestion and social publishing state [automated]"
            git pull --rebase
            git push
          fi
      - name: Preserve Telegram ingestion failure
        if: steps.telegram_ingest.outcome == 'failure'
        run: |
          echo "::error::Telegram video ingestion failed. No unconfirmed upload will be published."
          exit 1
      - name: Preserve publishing failure
        if: steps.autopilot.outcome == 'failure'
        run: |
          echo "::error::One or more social publishing destinations failed. Successful destinations were recorded and will not be duplicated."
          exit 1
      - name: Alert Telegram when social publishing recovery is required
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          message="⚠️ Property social publishing failed after automatic retry. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
