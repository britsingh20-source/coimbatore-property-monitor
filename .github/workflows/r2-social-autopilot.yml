name: R2 Social Publishing Autopilot

# Corrected Othakalmandapam republish trigger: 2026-08-22

# Othakalmandapam correction replacement trigger: 2026-08-22

# YouTube credential test: 2026-08-22

# Instagram cross-post test: 2026-08-22

# Facebook token retest: 2026-08-22 fresh Bright system-user token
# 2026-08-22 Facebook Page credential verification

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/r2-social-autopilot.yml"
      - "r2_social_autopilot.py"
      - "telegram_r2_ingest.py"
      - "social_content.py"
      - "send_telegram_prompts.py"
      - "video_property_matcher.py"
      - "meta_publisher.py"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scan and prepare metadata without publishing
        required: true
        default: true
        type: boolean

concurrency:
  group: r2-social-publishing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import new Telegram property videos to R2
        id: telegram_ingest
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_SOCIAL_PREFIX: social-ready/
          TELEGRAM_MAX_VIDEO_BYTES: "20971520"
        run: python telegram_r2_ingest.py
      - name: Scan R2 and publish new property videos
        id: autopilot
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_SOCIAL_PREFIX: social-ready/
          SOCIAL_MAX_PER_RUN: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SOCIAL_MATCH_MODEL: gemini-2.5-flash-lite
          SOCIAL_MATCH_MIN_CONFIDENCE: "0.85"
          SOCIAL_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[social-live-test]')) }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
        run: python r2_social_autopilot.py
      - name: Commit ingestion and publishing state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "property-social-bot"
          git config user.email "actions@github.com"
          git add data/telegram_ingest_state.json data/social_publish_state.json data/telegram_prompt_queue.json
          if git diff --staged --quiet; then
            echo "No Telegram ingestion, social publishing or prompt-pairing state changes."
          else
            git commit -m "Update Telegram ingestion and social publishing state [automated]"
            git pull --rebase
            git push
          fi
      - name: Preserve Telegram ingestion failure
        if: steps.telegram_ingest.outcome == 'failure'
        run: |
          echo "::error::Telegram video ingestion failed. No unconfirmed upload will be published."
          exit 1
      - name: Preserve publishing failure
        if: steps.autopilot.outcome == 'failure'
        run: |
          echo "::error::One or more social publishing destinations failed. Successful destinations were recorded and will not be duplicated."
          exit 1
