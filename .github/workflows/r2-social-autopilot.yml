name: R2 Social Publishing Autopilot

# Emergency recovery coordination: isolated publisher owns the current live attempt.

# Case-corrected VIDEO_ID live recovery trigger: 2026-08-30 08:35 IST

# Standalone Telegram ID pairing live publish: 2026-08-24 uAJus2hXLTo

# Manual Pogalur pairing publish trigger: 2026-08-23

# Post-reset Gemini quota retest: 2026-08-23 17:00 IST

# Corrected Othakalmandapam republish trigger: 2026-08-22

# Othakalmandapam correction replacement trigger: 2026-08-22

# YouTube credential test: 2026-08-22

# Instagram cross-post test: 2026-08-22

# Facebook token retest: 2026-08-22 fresh Bright system-user token
# 2026-08-22 Facebook Page credential verification

on:
  repository_dispatch:
    types: [telegram-property-upload]
  schedule:
    # Six off-peak opportunities per hour reduce the chance that a Telegram
    # upload waits when GitHub drops an individual scheduled event.
    - cron: "7,17,27,37,47,57 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/r2-social-autopilot.yml"
      - "r2_social_autopilot.py"
      - "telegram_r2_ingest.py"
      - "reference_frames.py"
      - "requirements.txt"
      - "social_content.py"
      - "send_telegram_prompts.py"
      - "video_property_matcher.py"
      - "meta_publisher.py"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scan and prepare metadata without publishing
        required: true
        default: true
        type: boolean

concurrency:
  # Serialize with Property Monitor because both workflows update the shared
  # Telegram prompt queue in the repository.
  group: property-automation-state
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install video normalization tools
        timeout-minutes: 5
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: pip install -r requirements.txt
      - name: Restore Telegram polling while webhook recovery is unavailable
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "drop_pending_updates=false" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteWebhook" >/dev/null
          echo "Telegram polling mode is active."

      - name: Import new Telegram property videos to R2
        id: telegram_ingest
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_SOCIAL_PREFIX: social-ready/
          TELEGRAM_MAX_VIDEO_BYTES: "20971520"
          TELEGRAM_WEBHOOK_UPDATE_JSON: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload.update) || '' }}
        run: python telegram_r2_ingest.py
      - name: Scan R2 and publish new property videos
        id: autopilot
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_SOCIAL_PREFIX: social-ready/
          SOCIAL_MAX_PER_RUN: "5"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SOCIAL_MATCH_MODEL: gemini-3.5-flash-lite
          SOCIAL_MATCH_MIN_CONFIDENCE: "0.85"
          SOCIAL_DRY_RUN: ${{ github.event_name == 'repository_dispatch' && 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[social-live-test]'))) }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
        run: python r2_social_autopilot.py
      - name: Commit ingestion and publishing state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "property-social-bot"
          git config user.email "actions@github.com"
          git add data/telegram_ingest_state.json data/social_publish_state.json data/telegram_prompt_queue.json
          if git diff --staged --quiet; then
            echo "No Telegram ingestion, social publishing or prompt-pairing state changes."
          else
            git commit -m "Update Telegram ingestion and social publishing state [automated]"
            git pull --rebase
            git push
          fi
      - name: Preserve Telegram ingestion failure
        if: steps.telegram_ingest.outcome == 'failure'
        run: |
          echo "::error::Telegram video ingestion failed. No unconfirmed upload will be published."
          exit 1
      - name: Preserve publishing failure
        if: steps.autopilot.outcome == 'failure'
        run: |
          echo "::error::One or more social publishing destinations failed. Successful destinations were recorded and will not be duplicated."
          exit 1
      - name: Alert Telegram when social publishing recovery is required
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          message="⚠️ Property social publishing failed after automatic retry. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
