name: Create R2 social-ready folder

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/create-r2-social-folder.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install "boto3>=1.34,<2"
      - name: Create social-ready prefix in R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import boto3

          required = [
              "R2_ACCOUNT_ID",
              "R2_ACCESS_KEY_ID",
              "R2_SECRET_ACCESS_KEY",
              "R2_BUCKET_NAME",
          ]
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing required R2 secrets: " + ", ".join(missing))

          client = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
          )
          bucket = os.environ["R2_BUCKET_NAME"]
          client.put_object(
              Bucket=bucket,
              Key="social-ready/.keep",
              Body=b"",
              ContentType="application/octet-stream",
          )
          result = client.list_objects_v2(
              Bucket=bucket,
              Prefix="social-ready/",
              MaxKeys=5,
          )
          keys = [item["Key"] for item in result.get("Contents", [])]
          if "social-ready/.keep" not in keys:
              raise SystemExit("R2 social-ready prefix verification failed")
          print(f"Created and verified social-ready/ in bucket {bucket}")
          PY
