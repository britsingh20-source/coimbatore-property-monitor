name: Interior Trend Radar

on:
  workflow_dispatch:
    inputs:
      deliver_to_telegram:
        description: Send the production pack to Telegram
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: interior-trend-radar
  cancel-in-progress: false

jobs:
  discover-analyze-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      INTERIOR_CONTACT: ${{ secrets.INTERIOR_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Telegram client dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Test Interior Trend Radar
        run: python -m unittest discover -s interior_trend_radar/tests -v
      - name: Discover recent interior videos
        run: python -m interior_trend_radar.discovery interior_trend_radar/config.json interior_trend_radar/output/candidates.json
      - name: Build YouTube-reference Gemini prompt
        shell: bash
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.deliver_to_telegram }}" == "true" ]]; then
            args+=(--deliver)
          fi
          python -m interior_trend_radar.reference_first \
            interior_trend_radar/output/candidates.json \
            interior_trend_radar/config.json \
            interior_trend_radar/output/production_pack.json \
            --state data/interior_trend_state.json \
            "${args[@]}"
      - name: Save used-video history
        if: ${{ github.event_name == 'schedule' || inputs.deliver_to_telegram }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "interior-trend-bot"
          git config user.email "actions@github.com"
          git add data/interior_trend_state.json
          if git diff --staged --quiet; then
            echo "No new interior prompts were consumed."
          else
            git commit -m "Record daily Olive Tree interior prompts [automated]"
            git pull --rebase
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: interior-trend-radar-pack
          path: interior_trend_radar/output/
          retention-days: 14
