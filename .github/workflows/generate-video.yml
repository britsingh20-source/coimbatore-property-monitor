name: Render Professional Approved Property Videos

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/generate-video.yml
      - professional_video/**
      - prepare_remotion_job.py
      - prepare_free_assets.py
      - media_sources.py
      - map_assets.py
      - requirements.txt
      - data/video_jobs/**
  push:
    branches: [main]
    paths:
      - data/approved_video_ids.txt
      - data/video_jobs/**
      - assets/sample_b64/**

concurrency:
  group: property-video-generation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: professional_video/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: professional_video
      - name: Decode bundled sample visuals
        run: python sample_assets.py
      - name: Source licensed media and create Tamil male voice-over
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TAMIL_MALE_VOICE: ta-IN-ValluvarNeural
        run: python prepare_free_assets.py
      - name: Render professional Remotion reels
        id: professional
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r video_id; do
            [[ -z "$video_id" || "$video_id" == \#* ]] && continue
            python prepare_remotion_job.py "data/video_jobs/${video_id}.json"
            mkdir -p "outputs/${video_id}"
            (
              cd professional_video
              npx remotion render src/index.ts PropertyReel \
                "../outputs/${video_id}/professional-vertical.mp4" \
                --props="../data/remotion_props/${video_id}.json" \
                --codec=h264 --crf=18 --concurrency=2
            )
          done < data/approved_video_ids.txt
      - name: Emergency FFmpeg fallback
        if: steps.professional.outcome == 'failure'
        run: |
          echo "Remotion failed; rendering the reviewable FFmpeg fallback. Inspect render-mode.txt."
          python render_free_approved.py
          mkdir -p outputs
          echo "FFMPEG_FALLBACK" > outputs/render-mode.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: professional-approved-property-videos
          path: |
            outputs/**/*.mp4
            outputs/render-mode.txt
            data/media_attribution/*.json
            data/geocoding/*.json
            data/voiceover_scripts/*.txt
          if-no-files-found: warn
          retention-days: 7
