name: Render Free Approved Property Videos

on:
  workflow_dispatch: {}

concurrency:
  group: property-video-generation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Render only approved IDs without a paid video API
        run: python render_free_approved.py
      - uses: actions/upload-artifact@v4
        with:
          name: free-approved-property-videos
          path: outputs/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
