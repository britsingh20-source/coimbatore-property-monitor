name: Render Autopilot Property Videos

on:
  workflow_dispatch:
    inputs:
      video_ids:
        description: "Optional comma-separated property video IDs; blank uses the manual approval file"
        required: false
        type: string
      publish_to_meta:
        description: "After a successful manual render, publish to Instagram and Facebook"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [render-property-videos]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/generate-video.yml
      - .github/workflows/monitor.yml
      - professional_video/**
      - prepare_remotion_job.py
      - prepare_free_assets.py
      - select_render_jobs.py
      - video_pipeline.py
      - render_free_approved.py
      - media_sources.py
      - free_broll_sources.py
      - visual_broll_validator.py
      - meta_publisher.py
      - publish_render_queue.py
      - social_caption.py
      - map_assets.py
      - requirements.txt
      - tamil_voiceover.py
      - tests/test_free_broll_sources.py
      - tests/test_visual_broll_validator.py
      - tests/test_select_render_jobs.py
      - tests/test_tamil_voiceover.py
      - tests/test_social_caption.py
      - data/video_jobs/**
  push:
    branches: [main]
    paths:
      - data/approved_video_ids.txt
      - data/video_jobs/**
      - assets/sample_b64/**

concurrency:
  group: property-video-generation
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select only requested renderable jobs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          REQUESTED_VIDEO_IDS: ${{ github.event.client_payload.video_ids || inputs.video_ids || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python select_render_jobs.py --output data/render_queue.txt
          cat data/render_queue.txt
          if [[ -s data/render_queue.txt ]]; then
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
            echo "No renderable property jobs were requested." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v6
        if: steps.select.outputs.has_jobs == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v6
        if: steps.select.outputs.has_jobs == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: professional_video/package-lock.json
      - name: Install system render dependencies
        if: steps.select.outputs.has_jobs == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install base Python dependencies
        if: steps.select.outputs.has_jobs == 'true'
        run: pip install -r requirements.txt
      - name: Validate automation and media pipeline
        if: steps.select.outputs.has_jobs == 'true'
        run: python -m unittest discover -s tests -v
      - name: Install Remotion dependencies
        if: steps.select.outputs.has_jobs == 'true'
        run: npm ci
        working-directory: professional_video
      - name: Decode bundled sample visuals
        if: steps.select.outputs.has_jobs == 'true'
        run: python sample_assets.py

      - name: Verify exact Cloudflare R2 villa B-roll folders
        if: steps.select.outputs.has_jobs == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import boto3

          required = ("R2_ACCOUNT_ID", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY", "R2_BUCKET_NAME")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing R2 secrets: " + ", ".join(missing))
          bucket = os.environ["R2_BUCKET_NAME"].strip()
          account_id = os.environ["R2_ACCOUNT_ID"].strip()
          client = boto3.client(
              "s3",
              endpoint_url=f"https://{account_id}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"].strip(),
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"].strip(),
              region_name="auto",
          )
          prefixes = (
              "villas/Road/",
              "villas/bedroom/",
              "villas/dining & Kitchen/",
              "villas/exterior/",
              "villas/living_room/",
          )
          total = 0
          for prefix in prefixes:
              response = client.list_objects_v2(Bucket=bucket, Prefix=prefix, MaxKeys=1000)
              media = [item["Key"] for item in response.get("Contents", []) if item["Key"].lower().endswith((".mp4", ".mov", ".webm", ".m4v"))]
              total += len(media)
              print(f"R2 folder r2://{bucket}/{prefix} -> {len(media)} video(s)")
          if total == 0:
              raise SystemExit(f"No video B-roll found under r2://{bucket}/villas/.")
          print(f"R2 villa B-roll verified: {total} video(s) available.")
          PY

      - name: Source licensed media, maps and Tamil male voice-over
        id: assets
        if: steps.select.outputs.has_jobs == 'true'
        continue-on-error: true
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BROLL_MODEL: gemini-3.6-flash
          BROLL_VISUAL_MIN_SCORE: "72"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_OWN_FOOTAGE_ROOT: ""
          TAMIL_MALE_VOICE: ta-IN-ValluvarNeural
          VIDEO_IDS_FILE: data/render_queue.txt
          ASSET_FAILURES_FILE: outputs/asset-failure-ids.txt
        shell: bash
        run: python prepare_free_assets.py

      - name: Render each property independently
        id: render
        if: steps.select.outputs.has_jobs == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p outputs
          : > outputs/failed-render-ids.txt
          : > outputs/fallback-render-ids.txt
          while IFS= read -r video_id; do
            [[ -z "$video_id" || "$video_id" == \#* ]] && continue
            mkdir -p "outputs/$video_id"
            if [[ -f outputs/asset-failure-ids.txt ]] && grep -Fxq "$video_id" outputs/asset-failure-ids.txt; then
              echo "$video_id" >> outputs/failed-render-ids.txt
              echo "ASSET_OR_VOICE_FAILED" > "outputs/$video_id/render-mode.txt"
              echo "::error::Skipping $video_id because fresh media or voice preparation failed; stale assets are prohibited."
              continue
            fi
            printf '%s\n' "$video_id" > data/single-render-queue.txt
            if (
              set -euo pipefail
              python prepare_remotion_job.py "data/video_jobs/${video_id}.json"
              props_file="data/remotion_props/${video_id}.json"
              python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); assert data["videoId"] == sys.argv[2], (data["videoId"], sys.argv[2]); print("Rendering", data["videoId"], data["location"], data["title"])' "$props_file" "$video_id"
              props_path="$(realpath "$props_file")"
              cd professional_video
              npx remotion render src/index.ts PropertyReel \
                "../outputs/${video_id}/${video_id}-professional-vertical.mp4" \
                --props="$props_path" \
                --codec=h264 --crf=18 --concurrency=2
            ); then
              echo "REMOTION" > "outputs/$video_id/render-mode.txt"
              echo "Rendered $video_id with Remotion."
              continue
            fi
            echo "::warning::Remotion failed for $video_id; attempting its isolated FFmpeg fallback."
            if VIDEO_IDS_FILE=data/single-render-queue.txt python render_free_approved.py; then
              echo "$video_id" >> outputs/fallback-render-ids.txt
              echo "FFMPEG_FALLBACK" > "outputs/$video_id/render-mode.txt"
            else
              echo "$video_id" >> outputs/failed-render-ids.txt
              echo "FAILED" > "outputs/$video_id/render-mode.txt"
              echo "::error::Both render engines failed for $video_id."
            fi
          done < data/render_queue.txt
          if [[ -s outputs/failed-render-ids.txt ]]; then
            echo "::error::Some property videos failed. See failed-render-ids.txt."
            exit 1
          fi

      - name: Publish completed Reels to Meta
        id: meta_publish
        if: >-
          steps.select.outputs.has_jobs == 'true' &&
          steps.render.outcome == 'success' &&
          github.event_name != 'pull_request' &&
          ((github.event_name == 'workflow_dispatch' && inputs.publish_to_meta == true) || vars.META_AUTOPUBLISH_ENABLED == 'true')
        env:
          META_GRAPH_VERSION: v26.0
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PLATFORMS: instagram,facebook
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          VIDEO_IDS_FILE: data/render_queue.txt
        run: python publish_render_queue.py

      - uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.has_jobs == 'true'
        with:
          name: autopilot-property-videos-${{ github.run_number }}
          path: |
            outputs/**/*.mp4
            outputs/**/render-mode.txt
            outputs/social_publish/*.json
            outputs/failed-render-ids.txt
            outputs/fallback-render-ids.txt
            outputs/asset-failure-ids.txt
            data/render_queue.txt
            data/media_attribution/*.json
            data/geocoding/*.json
            data/voiceover_scripts/*.txt
            assets/audio/**/manifest.json
            data/remotion_props/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail incomplete autopilot run after uploading diagnostics
        if: always() && steps.select.outputs.has_jobs == 'true' && (steps.assets.outcome == 'failure' || steps.render.outcome == 'failure' || steps.meta_publish.outcome == 'failure')
        run: |
          echo "::error::At least one requested property did not complete the strict media, voice, render or requested Meta publish pipeline."
          exit 1
