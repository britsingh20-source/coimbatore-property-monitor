name: Render Autopilot Property Videos

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/generate-video.yml
      - professional_video/**
      - prepare_remotion_job.py
      - prepare_free_assets.py
      - select_render_jobs.py
      - video_pipeline.py
      - render_free_approved.py
      - media_sources.py
      - map_assets.py
      - requirements.txt
      - requirements-indic-parler.txt
      - tamil_voiceover.py
      - tests/test_tamil_voiceover.py
      - data/video_jobs/**
  push:
    branches: [main]
    paths:
      - data/approved_video_ids.txt
      - data/video_jobs/**
      - assets/sample_b64/**

concurrency:
  group: property-video-generation
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: professional_video/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Cache the gated Indic Parler model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: indic-parler-v1-${{ runner.os }}
      - name: Install Indic Parler-TTS when configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${HF_TOKEN:-}" ]]; then
            pip install -r requirements-indic-parler.txt
          else
            echo "::warning::HF_TOKEN is not configured; this run will retain the Edge emergency voice."
          fi
      - name: Validate automation and media pipeline
        run: python -m unittest discover -s tests -v
      - run: npm ci
        working-directory: professional_video
      - name: Select only new renderable jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python select_render_jobs.py --output data/render_queue.txt
          cat data/render_queue.txt
      - name: Decode bundled sample visuals
        run: python sample_assets.py
      - name: Source licensed media, maps and Tamil male voice-over
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          INDIC_PARLER_STYLE: ${{ vars.INDIC_PARLER_STYLE }}
          TTS_ALLOW_EDGE_FALLBACK: "false"
          TAMIL_MALE_VOICE: ta-IN-ValluvarNeural
          VIDEO_IDS_FILE: data/render_queue.txt
        shell: bash
        run: |
          if [[ -n "${HF_TOKEN:-}" ]]; then
            export TTS_ENGINE=indic-parler
            echo "Using strict AI4Bharat Indic Parler-TTS narration."
          else
            export TTS_ENGINE=edge
            echo "::warning::Using Edge emergency voice because HF_TOKEN is absent."
          fi
          python prepare_free_assets.py
      - name: Render professional Remotion reels
        id: professional
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r video_id; do
            [[ -z "$video_id" || "$video_id" == \#* ]] && continue
            python prepare_remotion_job.py "data/video_jobs/${video_id}.json"
            props_file="data/remotion_props/${video_id}.json"
            python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); assert data["videoId"] == sys.argv[2], (data["videoId"], sys.argv[2]); print("Rendering", data["videoId"], data["location"], data["title"])' "$props_file" "$video_id"
            mkdir -p "outputs/${video_id}"
            props_path="$(realpath "$props_file")"
            (
              cd professional_video
              npx remotion render src/index.ts PropertyReel \
                "../outputs/${video_id}/${video_id}-professional-vertical.mp4" \
                --props="$props_path" \
                --codec=h264 --crf=18 --concurrency=2
            )
          done < data/render_queue.txt
      - name: Emergency FFmpeg fallback
        if: steps.professional.outcome == 'failure'
        env:
          VIDEO_IDS_FILE: data/render_queue.txt
        run: |
          echo "Remotion failed; rendering the reviewable FFmpeg fallback. Inspect render-mode.txt."
          python render_free_approved.py
          mkdir -p outputs
          echo "FFMPEG_FALLBACK" > outputs/render-mode.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopilot-property-videos-${{ github.run_number }}
          path: |
            outputs/**/*.mp4
            outputs/render-mode.txt
            data/render_queue.txt
            data/media_attribution/*.json
            data/geocoding/*.json
            data/voiceover_scripts/*.txt
            assets/audio/**/manifest.json
            data/remotion_props/*.json
          if-no-files-found: warn
          retention-days: 7
