name: Kaggle AI B-roll POC

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Property video ID to animate with free Kaggle GPU"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-ai-broll:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install base dependencies and Kaggle CLI
        run: |
          pip install -r requirements.txt
          pip install "kaggle>=2,<3"

      - name: Prepare normal property media first
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          TAMIL_MALE_VOICE: ta-IN-ValluvarNeural
          VIDEO_IDS_FILE: data/kaggle-broll-queue.txt
          ASSET_FAILURES_FILE: outputs/kaggle-broll-asset-failures.txt
        shell: bash
        run: |
          printf '%s\n' "${{ inputs.video_id }}" > data/kaggle-broll-queue.txt
          python prepare_free_assets.py

      - name: Build offline LTX source bundle for Kaggle
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/LTX-Video .cache/ltx-video-src.tar.gz
          git clone --depth 1 https://github.com/Lightricks/LTX-Video.git /tmp/LTX-Video
          rm -rf /tmp/LTX-Video/.git
          mkdir -p .cache
          tar -C /tmp -czf .cache/ltx-video-src.tar.gz LTX-Video
          ls -lh .cache/ltx-video-src.tar.gz

      - name: Generate one AI B-roll clip on Kaggle free GPU
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python kaggle_ai_broll.py \
            --video-id "${{ inputs.video_id }}" \
            --ltx-bundle .cache/ltx-video-src.tar.gz

      - name: Show result location
        if: success()
        run: |
          cat "outputs/kaggle-ai-broll/${{ inputs.video_id }}/manifest.json"
          echo "AI B-roll is persisted in R2 under ai-broll/${{ inputs.video_id }}/"
