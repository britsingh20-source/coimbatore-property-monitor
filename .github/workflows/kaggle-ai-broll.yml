name: Kaggle AI B-roll POC

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Property video ID to animate with free Kaggle GPU"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-ai-broll:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install base dependencies and Kaggle CLI
        run: |
          pip install -r requirements.txt
          pip install "kaggle>=2,<3"

      - name: Pull known-good Kaggle LTX 2B input metadata
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .cache/ltx-reference
          mkdir -p .cache/ltx-reference
          kaggle kernels pull datnguyentien204/ltx-2b -p .cache/ltx-reference -m
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.cache/ltx-reference/kernel-metadata.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          summary = {
              'dataset_sources': data.get('dataset_sources', []),
              'kernel_sources': data.get('kernel_sources', []),
              'model_sources': data.get('model_sources', []),
          }
          print('Known-good Kaggle input sources:')
          print(json.dumps(summary, indent=2))
          if not any(summary.values()):
              raise SystemExit('Reference LTX notebook exposes no reusable Kaggle input sources')
          PY

      - name: Prepare normal property media first
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          TAMIL_MALE_VOICE: ta-IN-ValluvarNeural
          VIDEO_IDS_FILE: data/kaggle-broll-queue.txt
          ASSET_FAILURES_FILE: outputs/kaggle-broll-asset-failures.txt
        shell: bash
        run: |
          printf '%s\n' "${{ inputs.video_id }}" > data/kaggle-broll-queue.txt
          python prepare_free_assets.py

      - name: Build lightweight offline LTX source bundle for Kaggle
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/LTX-Video .cache/ltx-video-src.tar.gz
          mkdir -p .cache
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/Lightricks/LTX-Video.git /tmp/LTX-Video
          rm -rf /tmp/LTX-Video/.git
          tar -C /tmp -czf .cache/ltx-video-src.tar.gz LTX-Video
          ls -lh .cache/ltx-video-src.tar.gz
          python - <<'PY'
          from pathlib import Path
          p = Path('.cache/ltx-video-src.tar.gz')
          size = p.stat().st_size
          print(f'LTX source bundle bytes={size}')
          if size > 25 * 1024 * 1024:
              raise SystemExit(f'LTX source bundle is still too large for reliable kernel upload: {size} bytes')
          PY

      - name: Disable online prompt enhancer for offline Kaggle run
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('kaggle_ai_broll.py')
          text = p.read_text(encoding='utf-8')
          needle = '    cfg["text_encoder_model_name_or_path"] = str(text_model_root)\n'
          replacement = needle + '    cfg["prompt_enhancement_words_threshold"] = 0\n    mark("prompt_enhancer=disabled_offline")\n'
          if needle not in text:
              raise SystemExit('Could not locate LTX config patch point in kaggle_ai_broll.py')
          p.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Generate one AI B-roll clip on Kaggle free GPU
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python kaggle_ai_broll.py \
            --video-id "${{ inputs.video_id }}" \
            --ltx-bundle .cache/ltx-video-src.tar.gz \
            --reference-metadata .cache/ltx-reference/kernel-metadata.json

      - name: Show result location
        if: success()
        run: |
          cat "outputs/kaggle-ai-broll/${{ inputs.video_id }}/manifest.json"
          echo "AI B-roll is persisted in R2 under ai-broll/${{ inputs.video_id }}/"
