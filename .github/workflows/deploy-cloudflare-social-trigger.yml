name: Deploy Cloudflare Social Trigger

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/social-trigger/**"
      - ".github/workflows/deploy-cloudflare-social-trigger.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Validate deployment secrets
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          for pair in \
            "CLOUDFLARE_ACCOUNT_ID:$CF_ACCOUNT" \
            "CLOUDFLARE_API_TOKEN:$CF_TOKEN" \
            "R2_BUCKET_NAME:$R2_BUCKET" \
            "TELEGRAM_BOT_TOKEN:$TELEGRAM_TOKEN" \
            "TELEGRAM_CHAT_ID:$TELEGRAM_CHAT"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
          done

      - name: Create Cloudflare Queue if needed
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: cloudflare/social-trigger
        run: |
          set -euo pipefail
          npx wrangler queues create coimbatore-property-social-events || true

      - name: Create or locate Telegram pairing KV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: cloudflare/social-trigger
        shell: bash
        run: |
          set -euo pipefail
          title="coimbatore-property-social-trigger-pairing-state"
          namespaces="$(curl --fail --silent --show-error             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100")"
          kv_id="$(printf '%s' "$namespaces" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((x['id'] for x in d.get('result',[]) if x.get('title')=='$title'),''))")"
          if [[ -z "$kv_id" ]]; then
            created="$(curl --fail --silent --show-error -X POST               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               -H 'Content-Type: application/json'               --data "{\"title\":\"$title\"}"               "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces")"
            kv_id="$(printf '%s' "$created" | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['id'])")"
          fi
          python3 -c "from pathlib import Path; p=Path('wrangler.jsonc'); p.write_text(p.read_text().replace('PAIRING_STATE_NAMESPACE_ID','$kv_id'))"
          echo "Telegram pairing KV binding prepared."

      - name: Configure Worker secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: cloudflare/social-trigger
        run: |
          if [ -n "$GITHUB_DISPATCH_TOKEN" ]; then
            printf '%s' "$GITHUB_DISPATCH_TOKEN" | npx wrangler secret put GITHUB_DISPATCH_TOKEN
          else
            echo "Preserving the existing Cloudflare GITHUB_DISPATCH_TOKEN secret."
          fi
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$TELEGRAM_CHAT_ID" | npx wrangler secret put TELEGRAM_CHAT_ID

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: cloudflare/social-trigger
        run: npx wrangler deploy

      - name: Configure R2 object-create event notification
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        working-directory: cloudflare/social-trigger
        run: |
          set -euo pipefail
          # Enforce one notification rule for social-ready MP4 uploads.
          npx wrangler r2 bucket notification delete "$R2_BUCKET_NAME" \
            --queue coimbatore-property-social-events || true
          npx wrangler r2 bucket notification create "$R2_BUCKET_NAME" \
            --event-type object-create \
            --queue coimbatore-property-social-events \
            --prefix "social-ready/" \
            --suffix ".mp4"
