name: Property Monitor

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run property monitor
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit updated data
        run: |
          git config user.name "property-monitor-bot"
          git config user.email "actions@github.com"
          git add data/properties.csv
          git diff --staged --quiet || git commit -m "Update property data [automated]"
          git push
