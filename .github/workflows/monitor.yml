name: Property Monitor

on:
  schedule:
    # Two off-peak attempts per hour reduce the effect of GitHub dropping a
    # queued schedule event during Actions service congestion.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/monitor.yml"
      - "veo_prompt.py"
      - "send_telegram_prompts.py"
      - "reference_frames.py"
      - "requirements.txt"
      - "location_matcher.py"

concurrency:
  # The monitor and publisher both update repository-backed queue state. A
  # shared group prevents simultaneous commits and state.json conflicts.
  group: property-automation-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # A re-run must start from current main, not the stale SHA belonging
          # to the original run being retried.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run monitor
        id: monitor
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Stay below the free Gemini project's daily request allowance while
          # preserving new listings in retry_pending for later runs.
          MAX_VIDEOS_PER_RUN: "2"
          MAX_EXPLORATORY_PER_RUN: "1"
        run: python main.py
      - name: Commit state, records and approval jobs
        id: commit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          : > data/new_render_ids.txt
          git config user.name "property-monitor-bot"
          git config user.email "actions@github.com"
          before_commit="$(git rev-parse HEAD)"
          git add data/properties.csv data/state.json data/video_jobs || true
          if git diff --staged --quiet; then
            echo "No monitor changes to commit."
          else
            git commit -m "Update property monitor state [automated]"
            after_commit="$(git rev-parse HEAD)"
            python select_render_jobs.py \
              --event-name push \
              --before "$before_commit" \
              --after "$after_commit" \
              --output data/new_render_ids.txt
          fi
          git pull --rebase
          git push
      - name: Prepare one-time Telegram smoke-test prompt
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[telegram-test]')
        shell: bash
        run: printf '%s\n' "YeuCzhxC-j0" > data/new_render_ids.txt
      - name: Prepare requested Telegram prompt resend
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[telegram-resend-3HCxfx5DoJs]')
        shell: bash
        run: printf '%s\n' "3HCxfx5DoJs" > data/new_render_ids.txt
      - name: Prepare requested Nadupalayam prompt regeneration
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[telegram-resend-xTvjrweqpy4]')
        shell: bash
        run: printf '%s\n' "xTvjrweqpy4" > data/new_render_ids.txt
      - name: Send exact Gemini/Veo prompts to Telegram
        if: always() && steps.commit.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s data/new_render_ids.txt ]]; then
            echo "No newly approved property prompts to send."
            exit 0
          fi
          python send_telegram_prompts.py --ids-file data/new_render_ids.txt
          {
            echo "### Gemini/Veo prompts sent to Telegram"
            echo ""
            grep -vE '^\s*(#|$)' data/new_render_ids.txt | sed 's/^/- `/' | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit Telegram mobile-upload queue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "property-monitor-bot"
          git config user.email "actions@github.com"
          git add data/telegram_prompt_queue.json || true
          if git diff --staged --quiet; then
            echo "No Telegram prompt queue changes."
          else
            git commit -m "Queue Telegram property prompt for mobile upload [automated]"
            git pull --rebase
            git push
          fi
      - name: Preserve monitor failure after committing successful jobs
        if: steps.monitor.outcome == 'failure'
        run: |
          echo "::error::The monitor had one or more non-retryable analysis failures. Successful approved jobs were still committed and sent to Telegram."
          exit 1
      - name: Alert Telegram when monitor recovery is required
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          message="⚠️ Property Monitor failed after automatic retry. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
